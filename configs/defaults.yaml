# Default configuration for agentic workbench

# Model server settings
model:
  provider: "llamacpp_server"
  base_url: "http://localhost:8080"
  model_name: "ministral-3-8b-instruct"
  temperature: 0.7
  max_tokens: 2048
  timeout_seconds: 60

# Embedding settings
#   provider: "http"  → use remote Infinity server (fast startup, recommended)
#   provider: "local" → load sentence-transformers in-process (slow startup)
embeddings:
  provider: "http"
  model_name: "intfloat/multilingual-e5-base"
  # HTTP provider settings
  base_url: "http://127.0.0.1:8081"
  timeout_seconds: 120
  # Local provider settings (only used when provider: local)
  batch_size: 32
  device: "mps"

# Retrieval settings
retrieval:
  strategy: "hybrid"
  keyword_top_k: 20
  vector_top_k: 20
  merge_top_n: 50
  rrf_k: 60
  final_top_k: 5

# Reranking settings
#   provider: "http"           → use remote Infinity server (fast startup, recommended)
#   provider: "cross_encoder"  → load cross-encoder in-process (slow startup)
reranking:
  enabled: true
  provider: "http"
  model_name: "BAAI/bge-reranker-v2-m3"
  # HTTP provider settings
  base_url: "http://127.0.0.1:8082"
  timeout_seconds: 60
  top_n: 5

# Context builder settings
context:
  max_tokens: 2048
  max_chunks_per_doc: 3

# Chunking settings
chunking:
  strategy: "heading_aware"
  max_chunk_tokens: 512
  overlap_tokens: 50
  min_chunk_tokens: 100

# Web search settings (Day 5)
web_search:
  enabled: true
  provider: "duckduckgo"            # "duckduckgo" (zero-key) or "tavily" (needs TAVILY_API_KEY)
  max_results: 5
  confidence_threshold: 2           # min retrieval results before web fallback triggers

# Source fetch settings (Day 5)
source_fetch:
  timeout_seconds: 15
  max_chars: 8000
  user_agent: "AgenticWorkbench/1.0"

# Supervisor settings (Day 7)
supervisor:
  routing_mode: "hybrid"            # "hybrid" (default) | "heuristic_only" | "llm_only"

# Data paths
paths:
  data_dir: "./data"
  raw_data: "./data/raw"
  processed_data: "./data/processed"
  indexes_dir: "./data/indexes"
  active_index: "./data/indexes/active"
  index_snapshots: "./data/indexes/snapshots"

# Run settings
runs:
  output_dir: "./runs"
  logs_dir: "./runs/logs"
  traces_dir: "./runs/traces"
  reports_dir: "./runs/reports"

# Observability
observability:
  enable_tracing: true
  enable_metrics: true
  phoenix_endpoint: "http://localhost:6006"
  log_level: "INFO"
  